spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true
        http-only: true

app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  public-url: ${APP_PUBLIC_URL}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:${APP_PUBLIC_URL}}
  jwt:
    secret: ${APP_JWT_SECRET:${JWT_SECRET}}
  cookie:
    secure: true
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@schedulix.local}}
  sample-data:
    enabled: false

logging:
  level:
    root: INFO
    com.schedulix: INFO