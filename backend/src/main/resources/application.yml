spring:
  application:
    name: schedulix
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8080}

app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@schedulix.local}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret-key-at-least-32-chars}
    access-minutes: 15
    refresh-days: 7
  cookie:
    secure: false

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:schedulix}}
    username: ${DB_USER:schedulix}
    password: ${DB_PASSWORD:schedulix}

logging:
  level:
    com.schedulix: DEBUG